[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trecho_engine"
version = "0.1.0"
description = "Motor de processamento de vídeo do Trecho Studio"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Trecho Studio Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trecho_engine*"]
